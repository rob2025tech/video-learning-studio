[project]
name = "video-learning"
version = "0.1.0"
description = "Local-first CLI for turning videos on your Mac into a personal learning system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
video-learning = "video_learning.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_learning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM905 would force the readable triple-quoted stopword block into a huge list literal.
ignore = ["SIM905"]

[tool.ruff.lint.flake8-bugbear]
# Typer's idiomatic API puts Argument()/Option() in parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
